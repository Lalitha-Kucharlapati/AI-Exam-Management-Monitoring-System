<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Exam</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center font-sans">
  <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-3xl">
    
    <h2 class="text-2xl font-bold text-blue-700 mb-4">📝 Online Exam</h2>
    <p class="text-gray-800 mb-6"><strong>Student:</strong> {{ session.student_name }}</p>

    <form method="POST" action="/submit_exam" class="space-y-8">

      {% for q in questions %}
        {% set q_index = loop.index0 %}
        <div class="bg-gray-50 p-4 rounded-lg border border-gray-200">
          <p class="font-semibold text-gray-800 mb-2">{{ q_index + 1 }}. {{ q.question }}</p>

          <div class="space-y-1">
            {% for opt in q.options %}
              {% set opt_letter = opt.split('.')[0].strip() %}
              <label class="block">
                <input type="radio" name="q{{ q_index }}" value="{{ opt_letter }}" required class="mr-2">
                {{ opt }}
              </label>
            {% endfor %}
          </div>
        </div>
      {% endfor %}

      <!-- 🔔 Real-time violation alert -->
      <div id="warning-box" class="text-white text-center bg-red-600 p-3 rounded-lg hidden font-semibold">
        <!-- Warning appears here -->
      </div>

      <button
        type="submit"
        class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-2 rounded-lg shadow transition"
      >
        Submit Exam
      </button>
    </form>

    <!-- Back to home -->
    <div class="mt-6 text-center">
      <a href="/" class="text-sm text-blue-600 hover:underline">← Back to Home</a>
    </div>
  </div>

<script>
  let terminationSent = false;

  function sendTermination() {
    if (!terminationSent) {
      terminationSent = true;

      // Send termination record
      fetch('/record_termination', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ action: 'terminate' }),
        keepalive: true
      });

      // Stop monitoring
      fetch('/stop_monitoring', {
        method: 'POST',
        keepalive: true
      });

      // Optional alert
      alert("You have been terminated due to violation of rules.");
    }
  }

  // Periodically check termination status from server
  const checkTermination = setInterval(() => {
    fetch('/check_status')
      .then(res => res.text())
      .then(status => {
        console.log("✅ check_status:", status);  // Debug info
        if (status.trim().toUpperCase() === 'TERMINATED') {
          
          sendTermination();
          window.location.href = '/terminated';
        }
      })
      .catch(err => console.error("❌ Error checking status:", err));
  }, 3000); // Every 3 seconds

  // Handle tab closing, reloading, etc.
  window.addEventListener("beforeunload", function (e) {
    sendTermination();
    e.preventDefault();
    e.returnValue = '';
  });

  // Handle click on "Back to Home" (if such link exists)
  window.addEventListener("DOMContentLoaded", () => {
    const backLink = document.querySelector('a[href="/"]');
    if (backLink) {
      backLink.addEventListener('click', function (e) {
        e.preventDefault();
        sendTermination();
        setTimeout(() => {
          window.location.href = '/';
        }, 300); // Delay to allow fetch to complete
      });
    }
  });
</script>




</body>
</html>
